    prompt: >-
      Analyze a completed work item for quality, cost, rework, and process
      improvements without silently changing policy.
    expected:
      output_schema_valid: true
  - id: respects-scope
    prompt: >-
      Execute the skill using only the supplied work-item context and
      constraints.
