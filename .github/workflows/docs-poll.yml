name: docs lock poll

# Pull-side backstop for the versioned-docs contract. Product repos push
# lock updates by dispatching docs-release.yml after each release, but a
# broken or under-scoped DOCS_SITE_DISPATCH_TOKEN drops that push
# silently (the product-side step is deliberately fail-soft). This job
# re-runs the pull path on a schedule: `bun run docs:update` polls every
# product repo's published releases for docs-<v>.tar.gz assets, keeps the
# newest 5 per product, refreshes sha256 + sidebar pages in
# docs-versions.lock.json, verifies the site still builds, and opens a
# bump PR on a fixed branch (auto-merged when checks allow).
#
# Manual run: gh workflow run docs-poll.yml -R oxidean/oxidean.dev

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h, off the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  poll:
    name: poll product releases for docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      # Same reasoning as docs-release.yml: this workflow exists to repair
      # the lockfile, so a stale/broken digest must not kill the install.
      # The post-update sync below stays strict via the CI env.
      - name: install deps
        env:
          DOCS_SYNC_STRICT: "0"
        run: bun install --frozen-lockfile

      - name: Poll product releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run docs:update

      - name: Lockfile changed?
        id: diff
        run: |
          if git diff --quiet docs-versions.lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lockfile already current — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat docs-versions.lock.json
          fi

      - name: Verify site builds with the refreshed lock
        if: steps.diff.outputs.changed == 'true'
        run: bun run docs:sync && bun run build

      # GH_TOKEN prefers the dispatch PAT so the bump PR fires normal
      # pull_request checks; falls back to GITHUB_TOKEN when the org
      # secret is not installed on this repo.
      - name: Open lock-bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git

          branch="docs-poll/auto"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs-versions.lock.json
          git commit -m "chore(docs): sync lockfile from release poll"
          git push -f origin "$branch"

          body="Scheduled \`bun run docs:update\` picked up docs-versions.lock.json drift ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})). Filed by docs-poll.yml — the pull-side backstop for the product-release dispatch."
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' || true)
          if [ -z "$pr" ]; then
            gh pr create \
              --title "chore(docs): sync docs-versions.lock.json (release poll)" \
              --body "$body" \
              --label documentation
            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          else
            gh pr edit "$pr" --body "$body"
          fi
          echo "bump PR: #$pr"
          gh pr merge "$pr" --auto --squash || \
            echo "::notice::auto-merge unavailable — PR #${pr} waits for manual merge"
